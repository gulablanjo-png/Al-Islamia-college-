<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Panel - Al Islamia College</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f5;
      color: #183028;
    }

    header {
      background: #075e3b;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      width: 95%;
      max-width: 1200px;
      margin: 25px auto;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 12px;
      box-shadow: 0 3px 15px #0001;
      margin-bottom: 20px;
    }

    h2 {
      color: #075e3b;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 12px 0 6px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccd8d2;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      border: none;
      border-radius: 7px;
      padding: 10px 15px;
      margin: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    .login-btn,
    .refresh {
      background: #075e3b;
      color: white;
    }

    .approve {
      background: #16834c;
      color: white;
    }

    .reject {
      background: #c62828;
      color: white;
    }

    .delete {
      background: #555;
      color: white;
    }

    .print {
      background: #555;
      color: white;
    }

    .logout {
      background: #222;
      color: white;
    }

    .message {
      margin-top: 15px;
      font-weight: bold;
    }

    .error {
      color: #b42318;
    }

    .success {
      color: #08753f;
    }

    #dashboard {
      display: none;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: right;
      vertical-align: top;
    }

    th {
      background: #e7f3ed;
      color: #075e3b;
    }

    .status {
      font-weight: bold;
    }

    .submitted {
      color: #996c00;
    }

    .approved {
      color: #08753f;
    }

    .rejected {
      color: #b42318;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .search {
      max-width: 450px;
    }

    @media print {
      body * {
        visibility: hidden;
      }

      #printArea,
      #printArea * {
        visibility: visible;
      }

      #printArea {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Al Islamia Oriental Degree College</h1>
  <p>Admin Panel — Kaloi, Tharparker</p>
</header>

<div class="container">

  <!-- LOGIN -->
  <div id="loginBox" class="card">

    <h2>Admin Login</h2>

    <label>Admin Email</label>
    <input
      type="email"
      id="email"
      placeholder="اپنا Admin Email لکھیں"
    >

    <label>Password</label>
    <input
      type="password"
      id="password"
      placeholder="اپنا Password لکھیں"
    >

    <button class="login-btn" onclick="login()">
      Login
    </button>

    <div id="loginMessage" class="message"></div>

  </div>


  <!-- DASHBOARD -->
  <div id="dashboard">

    <div class="card">

      <div class="topbar">

        <div>
          <h2>داخلہ درخواستیں</h2>
          <p id="totalCount">کل درخواستیں: 0</p>
        </div>

        <div>
          <button class="refresh" onclick="loadApplications()">
            Refresh
          </button>

          <button class="print" onclick="window.print()">
            Print
          </button>

          <button class="logout" onclick="logout()">
            Logout
          </button>
        </div>

      </div>

      <input
        class="search"
        type="text"
        id="searchBox"
        placeholder="نام، فون، Application Number یا پروگرام تلاش کریں"
        oninput="filterApplications()"
      >

    </div>


    <div id="printArea" class="card">

      <div class="table-wrap">

        <table>

          <thead>
            <tr>
              <th>Application No.</th>
              <th>نام</th>
              <th>والد کا نام</th>
              <th>فون</th>
              <th>پروگرام</th>
              <th>پتہ</th>
              <th>تاریخ</th>
              <th>اسٹیٹس</th>
              <th>Action</th>
            </tr>
          </thead>

          <tbody id="applicationsBody">
          </tbody>

        </table>

      </div>

    </div>

  </div>

</div>


<script>

  const db = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  let applications = [];


  // LOGIN
  async function login() {

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const message = document.getElementById("loginMessage");

    message.innerHTML = "";

    if (!email || !password) {
      message.innerHTML =
        '<p class="error">Email اور Password درج کریں۔</p>';
      return;
    }

    const { data, error } =
      await db.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {

      console.error(error);

      message.innerHTML =
        '<p class="error">Login ناکام۔ Email یا Password چیک کریں۔</p>';

      return;
    }

    document.getElementById("loginBox").style.display = "none";
    document.getElementById("dashboard").style.display = "block";

    await loadApplications();
  }


  // CHECK EXISTING LOGIN
  async function checkSession() {

    const { data } = await db.auth.getSession();

    if (data.session) {

      document.getElementById("loginBox").style.display = "none";
      document.getElementById("dashboard").style.display = "block";

      await loadApplications();
    }
  }


  // LOAD APPLICATIONS
  async function loadApplications() {

    const body =
      document.getElementById("applicationsBody");

    body.innerHTML =
      '<tr><td colspan="9">درخواستیں لوڈ ہو رہی ہیں...</td></tr>';

    const { data, error } = await db
      .from("applications")
      .select("*")
      .order("created_at", { ascending: false });

    if (error) {

      console.error(error);

      body.innerHTML =
        '<tr><td colspan="9" class="error">درخواستیں لوڈ نہیں ہو سکیں۔</td></tr>';

      return;
    }

    applications = data || [];

    renderApplications(applications);
  }


  // DISPLAY APPLICATIONS
  function renderApplications(list) {

    const body =
      document.getElementById("applicationsBody");

    document.getElementById("totalCount").textContent =
      "کل درخواستیں: " + list.length;

    if (list.length === 0) {

      body.innerHTML =
        '<tr><td colspan="9">کوئی درخواست موجود نہیں۔</td></tr>';

      return;
    }

    body.innerHTML = list.map(app => {

      const statusClass =
        app.status === "Approved"
          ? "approved"
          : app.status === "Rejected"
          ? "rejected"
          : "submitted";

      return `
        <tr>

          <td>
            <strong>${escapeHtml(app.app_no)}</strong>
          </td>

          <td>
            ${escapeHtml(app.name)}
          </td>

          <td>
            ${escapeHtml(app.father)}
          </td>

          <td>
            ${escapeHtml(app.phone)}
          </td>

          <td>
            ${escapeHtml(app.program)}
          </td>

          <td>
            ${escapeHtml(app.address || "")}
          </td>

          <td>
            ${formatDate(app.created_at)}
          </td>

          <td class="status ${statusClass}">
            ${escapeHtml(app.status)}
          </td>

          <td>

            <button
              class="approve"
              onclick="changeStatus('${app.id}', 'Approved')">
              Approve
            </button>

            <button
              class="reject"
              onclick="changeStatus('${app.id}', 'Rejected')">
              Reject
            </button>

            <button
              class="delete"
              onclick="deleteApplication('${app.id}')">
              Delete
            </button>

          </td>

        </tr>
      `;

    }).join("");
  }


  // CHANGE STATUS
  async function changeStatus(id, status) {

    const text =
      status === "Approved"
        ? "کیا آپ اس درخواست کو Approve کرنا چاہتے ہیں؟"
        : "کیا آپ اس درخواست کو Reject کرنا چاہتے ہیں؟";

    if (!confirm(text)) {
      return;
    }

    const { error } = await db
      .from("applications")
      .update({
        status: status
      })
      .eq("id", id);

    if (error) {

      alert("Status تبدیل نہیں ہو سکا۔");
      console.error(error);
      return;
    }

    await loadApplications();
  }


  // DELETE
  async function deleteApplication(id) {

    if (!confirm("کیا آپ واقعی یہ درخواست Delete کرنا چاہتے ہیں؟")) {
      return;
    }

    const { error } = await db
      .from("applications")
      .delete()
      .eq("id", id);

    if (error) {

      alert("درخواست Delete نہیں ہو سکی۔");
      console.error(error);
      return;
    }

    await loadApplications();
  }


  // SEARCH
  function filterApplications() {

    const query =
      document.getElementById("searchBox")
        .value
        .trim()
        .toLowerCase();

    if (!query) {

      renderApplications(applications);
      return;
    }

    const filtered =
      applications.filter(app => {

        return (
          String(app.app_no || "").toLowerCase().includes(query) ||
          String(app.name || "").toLowerCase().includes(query) ||
          String(app.father || "").toLowerCase().includes(query) ||
          String(app.phone || "").toLowerCase().includes(query) ||
          String(app.program || "").toLowerCase().includes(query)
        );

      });

    renderApplications(filtered);
  }


  // LOGOUT
  async function logout() {

    await db.auth.signOut();

    document.getElementById("dashboard").style.display = "none";
    document.getElementById("loginBox").style.display = "block";

    document.getElementById("password").value = "";
  }


  // DATE
  function formatDate(value) {

    if (!value) return "";

    try {
      return new Date(value).toLocaleDateString("en-GB");
    } catch {
      return value;
    }
  }


  // HTML ESCAPE
  function escapeHtml(value) {

    if (value === null || value === undefined) {
      return "";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  checkSession();

</script>

</body>
</html>
